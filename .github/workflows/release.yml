name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v6.0.0
        with:
          go-version: "1.26.6"
      - name: Cross-compile
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${GITHUB_REF_NAME}"
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              ext=""
              if [ "${os}" = windows ]; then ext=".exe"; fi
              out="dist/agent-identity-plane_${version}_${os}_${arch}${ext}"
              GOOS="${os}" GOARCH="${arch}" CGO_ENABLED=0 \
                go build -trimpath -ldflags "-s -w -X main.version=${version}" \
                -o "${out}" ./cmd/agent-identity-plane
            done
          done
      - name: Generate SBOM for release binaries
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          path: ./dist
          format: spdx-json
          output-file: ./dist/sbom.spdx.json
      - name: Checksum release assets
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > checksums.txt
      - uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090  # v2.2.1
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
